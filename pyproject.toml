[project]
name = "ttb-label-verification"
version = "0.1.0"
description = "TTB label verification proof of concept"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=2.43,<3.0",
    "pillow>=11.0,<13.0",
    "pydantic>=2.10,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
